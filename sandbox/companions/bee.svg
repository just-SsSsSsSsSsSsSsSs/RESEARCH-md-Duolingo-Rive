<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" class="rig rig-bee" data-companion="bee" data-hover="1" aria-label="bee companion rig">
  <defs>
    <radialGradient id="bee-body" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.65" stop-color="#f7c21c"/>
      <stop offset="1" stop-color="#b8850a"/>
    </radialGradient>
    <radialGradient id="bee-head" cx="45%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="0.7" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#a87500"/>
