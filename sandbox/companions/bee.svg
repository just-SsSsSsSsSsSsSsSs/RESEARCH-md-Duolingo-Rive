    <linearGradient id="bee-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0.45"/>
