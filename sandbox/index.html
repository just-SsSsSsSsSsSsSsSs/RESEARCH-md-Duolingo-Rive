<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandbox A1 - SVG rig prototype (Gate 4)</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --ink:#f1f5f9; --accent:#f59e0b; --ok:#22c55e; }
  * { box-sizing:border-box }
  html,body { margin:0; background:radial-gradient(120% 80% at 50% 0%, #1e3a5f 0%, var(--bg) 60%); color:var(--ink); font:16px/1.5 system-ui, "Segoe UI", Tahoma, sans-serif; min-height:100dvh }
  header { padding:14px 16px 6px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:baseline }
  header h1 { font-size:18px; margin:0 }
  header small { opacity:.7 }
  .bar { display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px }
  button { border:0; border-radius:12px; padding:10px 14px; font:inherit; font-weight:700; background:var(--card); color:var(--ink); cursor:pointer; box-shadow:0 2px 0 #0008 }
  button:active { transform:translateY(1px); box-shadow:none }
  button.primary { background:var(--accent); color:#111 }
  button[aria-pressed="true"] { outline:3px solid var(--ok) }
  #stage { display:grid; gap:12px; padding:10px 16px 24px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); align-items:end; justify-items:center; min-height:min(64dvh, 560px); position:relative; overflow:visible; padding-top:200px }
  #stage.sky { background:linear-gradient(180deg,#0000 0%, #0002 100%); border-radius:24px; margin:0 12px }
  #stage.sky::before { content:""; position:absolute; inset:auto 0 0 0; height:14%; background:linear-gradient(180deg,#0000,#0b1224); }
  .slot { width:100%; max-width:220px; aspect-ratio:200/240; background:linear-gradient(180deg,#0000 60%, #0003); border-radius:20px; position:relative; overflow:visible; will-change:transform; transform-origin:50% 60% }
  .slot.flying, .slot:has(svg) { z-index:5 }
  #stage.sky .slot { background:none }
  .perch { position:absolute; display:grid; place-items:center; background:#ffffff14; border:1px solid #ffffff2a; border-radius:16px; color:#fff; font-weight:800; pointer-events:none; direction:ltr }
  .perch.card { left:6%; top:42%; width:min(34%,220px); height:72px; font-size:22px }
  .perch.answer { right:8%; top:48%; width:min(22%,120px); height:56px; font-size:20px; background:#22c55e33; border-color:#22c55e66 }
  #stage:not(.sky) .perch { display:none }
  .star { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:.5; animation:tw 3s ease-in-out infinite alternate }
  @keyframes tw { from { opacity:.15 } to { opacity:.7 } }
  @media (prefers-reduced-motion: reduce) { .star { animation:none } }
  .slot svg { width:100%; height:100%; display:block; overflow:visible }
  #trace { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:9; overflow:visible }
  #trace polyline { fill:none; stroke:#ffd166; stroke-width:2; stroke-dasharray:6 5; opacity:.9 }
  #trace circle { fill:#ffd166; opacity:.9 }
  .slot .tag { position:absolute; inset:auto 0 -4px 0; text-align:center; font-size:13px; opacity:.75 }
  #caption { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:#000c; color:#ffe9b0; font:600 18px/1.3 system-ui, sans-serif; padding:10px 18px; border-radius:14px; max-width:80vw; text-align:center; z-index:5 }
  #caption[hidden] { display:none }
  #hud { position:fixed; inset:auto 8px 8px auto; background:#000a; font:12px/1.4 ui-monospace, monospace; padding:8px 10px; border-radius:10px; direction:ltr; white-space:pre; min-width:180px }
  #note { padding:0 16px 16px; font-size:13px; opacity:.75 }
</style>
</head>
<body>
<header>
  <h1>عينة Gate 4: هيكل SVG بمفاصل حيّة (بدون أي مكتبة)</h1>
  <small>فرع sandbox/a1-gate5-art-sw فقط - لا يمس التطبيق - محرك v2 (ADR-001) مع v1 كمرجع</small>
</header>

<div class="bar" id="count" role="group" aria-label="عدد الرفقاء">
  <button data-n="1" aria-pressed="true">رفيق واحد</button>
  <button data-n="3">3 رفقاء</button>
  <button data-n="5">5 رفقاء</button>
</div>
<div class="bar" id="art" role="group" aria-label="نوع الرسم">
  <button data-art="p1" aria-pressed="true">P1 رسم هندسي (إثبات)</button>
  <button data-art="p2">P2 طبقات مجسمة (AI)</button>
</div>
<div class="bar" id="actions" role="group" aria-label="الحركات">
  <button class="primary" data-act="fly">تطير في الشاشة</button>
  <button data-act="talk">يتكلم (مغلف اصطناعي)</button>
  <button data-act="say:audio/explain_sample.mp3">تشرح بصوت حقيقي</button>
  <button data-act="say:audio/owl_cheer.mp3">تهلل بصوتها</button>
  <button data-act="say:audio/owl_laugh.mp3">تضحك بصوتها</button>
  <button data-act="perch:card">تطير إلى الكارت</button>
  <button data-act="perch:answer">تطير إلى زر الإجابة</button>
  <button data-act="perch:home">تعود لمكانها</button>
  <button data-act="celebrate">إجابة صحيحة</button>
  <button data-act="nod">إيماءة</button>
  <button data-act="think">يفكر</button>
  <button data-act="sad">إجابة خطأ</button>
  <button data-act="blink">رمشة</button>
  <button data-act="auto" id="autoBtn" aria-pressed="true">حياة تلقائية: تعمل</button>
</div>
<div class="bar" id="acting" role="group" aria-label="التمثيل (K9)">
  <button data-actx="wink">غمزة</button>
  <button data-actx="dart">نظرة خاطفة</button>
  <button data-actx="roll">لفة هوائية</button>
  <button data-actx="intent">نية: تنظر ثم تقفز</button>
  <button data-actx="triumph">انتصار</button>
  <button data-actx="oops">خطأ كوميدي</button>
  <button data-actx="puzzled">حيرة</button>
  <button data-actx="brows" id="browsBtn" aria-pressed="true">الحواجب: ظاهرة</button>
  <button data-actx="poses" id="posesBtn" aria-pressed="false">الأوضاع 1-6</button>
  <span id="poseBtns" hidden>
    <button data-pose="alert">1 يقظة</button><button data-pose="charged">2 تحفز</button><button data-pose="launch">3 انطلاق</button>
    <button data-pose="puzzled">4 حيرة</button><button data-pose="triumph">5 انتصار</button><button data-pose="oops">6 خطأ</button><button data-pose="">تحرير</button>
  </span>
  <button data-actx="reel" class="primary">عرض 30 ثانية</button>
</div>
<div id="caption" hidden></div>
<div class="bar" id="engine" role="group" aria-label="محرك الحركة">
  <button data-engine="v2" aria-pressed="true">محرك v2 (فيزياء + مواصفة)</button>
  <button data-engine="v1">محرك v1 (مرجع)</button>
  <button data-tool="trace" id="traceBtn" aria-pressed="false">مسار الطيران: مخفي</button>
  <button data-tool="slow" id="slowBtn" aria-pressed="false">حركة بطيئة x0.25: متوقفة</button>
  <button data-tool="mute" id="muteBtn" aria-pressed="false">الصوت: مفعّل (يحتاج ضغطة أولى)</button>
</div>

<main id="stage" aria-live="polite"></main>
<p id="note">التركيز الحالي: «حكيمة» البومة (P2 طبقات مجسمة). اضغط عليها لتفاعل مختلف كل مرة؛ تطير وتدور وتحط من تلقاء نفسها كل بضع ثوان. P1 الهندسي يبقى كمرجع اختبار فقط.</p>
<div id="hud" aria-hidden="true">fps --</div>

<script type="module">
  import { mount } from './rig.js?v=g4';
  import { mountCinematic, clock } from './engine/motion.js';
  import './engine/flight.js';
  import { CharacterStates, validateSpec } from './engine/states.js';
  import { Foley } from './engine/foley.js';
  import { PoseLayer, validatePoses } from './engine/poses.js';
  import './engine/acting.js';
  import { validateActing } from './engine/acting.js';
  import { SoundBus } from './engine/sound.js';

  const ART = { p1: ['companions/owl.svg', 'companions/bee.svg'], p2: ['companions/owl_p2.svg'] };
  const params = new URLSearchParams(location.search);
  const ACTING = params.get('acting') !== '0';   // K9 feature flag: ?acting=0 restores the K8 behaviour exactly
  const BROWS = params.get('brows') !== '0';
  const POSES = params.get('poses') === '1';     // K9.2c-3: pose buttons 1..6 (freeze) + release
  const REEL = params.get('reel') === '1';       // K9.2c-7: 30 s scripted showcase
  const WINK_AUTO = params.get('wink') !== '0';  // K9.2c-2: wink on celebrate by escalation (medium tier); ?wink=0 disables     // K9.2b-2 feature flag: vector brows (also needs spec.acting.brows === true); off = display:none = zero paint
  let art = params.get('art') === 'p1' ? 'p1' : 'p2';
  let FILES = ART[art];
  let count = Number(params.get('n')) || 1;
  const NAMES = { owl: 'حكيمة', bee: 'نونة' };
  const stage = document.getElementById('stage');
  let rigs = [];

  // Engine flag (ADR-001): v2 = spec + physics (default); v1 = frozen reference for rollback / side-by-side.
  let engine = params.get('engine') === 'v1' ? 'v1' : 'v2';
  let SPEC = null;
  async function loadSpec() {
    if (SPEC) return SPEC;
    const res = await fetch('companions/owl.motion.json?v=k94a');
    SPEC = await res.json();
    const v = validateSpec(SPEC);
    const pp = validatePoses(SPEC, ['root','body','head','eyeL','eyeR','pupilL','pupilR','lidL','lidR','mouth','armL','armR','legL','legR','shadow','browL','browR']);
    if (pp.length) { v.ok = false; v.problems.push(...pp); }
    const pa = validateActing(SPEC); if (pa.length) { v.ok = false; v.problems.push(...pa); }
    if (!v.ok) console.warn('spec problems', v.problems);
    window.__specCheck = v;
    return SPEC;
  }
  // Trace overlay (G4 proof): one <svg> over the stage, one polyline per flight.
  let traceOn = params.get('trace') === '1';
  let traceSvg = null;
  function traceLayer() {
    if (traceSvg && traceSvg.isConnected) return traceSvg;
    traceSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    traceSvg.id = 'trace'; traceSvg.setAttribute('aria-hidden', 'true');
    stage.appendChild(traceSvg); return traceSvg;
  }
  function makeTracer(slot) {
    return (pts) => {
      if (!traceOn) return;
      const sr = stage.getBoundingClientRect(), r = slot.getBoundingClientRect();
      const t = slot.style.transform; // pts are relative to the slot home, so undo the current perch offset
      const m = new DOMMatrixReadOnly(getComputedStyle(slot).transform === 'none' ? '' : getComputedStyle(slot).transform);
      const ox = r.left - sr.left + r.width / 2 - m.e, oy = r.top - sr.top + r.height / 2 - m.f;
      const layer = traceLayer();
      layer.setAttribute('viewBox', `0 0 ${sr.width} ${sr.height}`);
      const pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      pl.setAttribute('points', pts.map((p) => `${(ox + p.x).toFixed(1)},${(oy + p.y).toFixed(1)}`).join(' '));
      layer.appendChild(pl);
      for (const i of [0, Math.floor(pts.length / 2), pts.length - 1]) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', (ox + pts[i].x).toFixed(1)); c.setAttribute('cy', (oy + pts[i].y).toFixed(1)); c.setAttribute('r', '4');
        layer.appendChild(c);
      }
      while (layer.childElementCount > 24) layer.firstElementChild.remove();
      void t;
    };
  }

  async function build(n) {
    count = n; FILES = ART[art];
    rigs.forEach((r) => { if (r.states) r.states.dispose(); if (r.poses) r.poses.dispose(); r.dispose(); });
    rigs = [];
    if (foley) { foley.dispose(); foley = null; }
    stage.replaceChildren(); traceSvg = null;
    const useV2 = engine === 'v2' && art === 'p2';
    if (useV2 && params.get('sfx') !== '0') { const sp = await loadSpec(); foley = new Foley(sp, stage, bus || (bus = new SoundBus(sp.sound))); window.__foley = foley; window.__bus = bus; }   // v2 spec names the P2 owl art; P1 stays on v1 as the reference
    const spec = useV2 ? await loadSpec() : null;
    const jobs = [];
    for (let i = 0; i < n; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      stage.appendChild(slot);
      const file = FILES[i % FILES.length];
      const job = useV2 ? mountCinematic(slot, spec, `i${i}`) : mount(slot, file, `i${i}`);
      jobs.push(job.then((rig) => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = NAMES[rig.svg.dataset.companion] || '';
        slot.appendChild(tag);
        slot.addEventListener('pointerdown', (ev) => { ev.stopPropagation(); tapReact(rig, slot); });
        if (useV2) { rig.trace = makeTracer(slot); rig.states = new CharacterStates(rig, spec); rig.states.on((ev) => { if (ev.type === 'enter') slot.dataset.state = ev.to; }); if (foley) foley.attach(rig, rig.states);
          if (ACTING && spec.acting && spec.acting.enabled !== false) rig.poses = new PoseLayer(rig, spec);
          const browsOn = ACTING && BROWS && spec.acting && spec.acting.brows === true;   // K9.2c: brows ship ON; ?brows=0 (or spec false) hides them
          rig.svg.querySelectorAll('[data-feature="brows"]').forEach((g) => { g.style.display = browsOn ? '' : 'none'; });
          if (ACTING) rig._stopSaccades = rig.startSaccades();   // K9.2c-2 idle micro-saccades (spec.gaze.saccade)
          if (ACTING && rig.startMovingHold) rig._stopHold = rig.startMovingHold();   // K9.4 moving hold: named idle impulses (spec.acting.performances.movingHold), ?perf=0 off
          if (ACTING && WINK_AUTO && rig.states) rig.states.on((ev) => { if (ev.type === 'enter' && ev.to === 'celebrate') { const t = rig.escalate('celebrate'); if (t !== 'small') rig.later(() => rig.wink(), 420); } });   // wink on every 3rd celebration, not every one
        }   // K9 acting layer, flags ?acting=0 ?brows=0 ?wink=0
        return rig;
      }));
    }
    rigs = await Promise.all(jobs);
    stage.classList.toggle('sky', art === 'p2');
    stage.dataset.engine = useV2 ? 'v2' : 'v1';
    if (art === 'p2') { sprinkleStars(); addPerches(); }
    window.__rigs = rigs;
    document.dispatchEvent(new CustomEvent('rigs-ready', { detail: { n, engine: stage.dataset.engine } }));
  }

  document.getElementById('engine').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.engine) {
      engine = b.dataset.engine;
      document.querySelectorAll('#engine button[data-engine]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.engine === engine)));
      build(count);
    } else if (b.dataset.tool === 'trace') {
      traceOn = !traceOn; b.setAttribute('aria-pressed', String(traceOn));
      b.textContent = traceOn ? 'مسار الطيران: ظاهر' : 'مسار الطيران: مخفي';
      if (!traceOn && traceSvg) traceSvg.replaceChildren();
    } else if (b.dataset.tool === 'slow') {
      setSlow(!slowOn);
    }
  });
  document.querySelectorAll('#engine button[data-engine]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.engine === engine)));
  document.getElementById('traceBtn').setAttribute('aria-pressed', String(traceOn));
  if (traceOn) document.getElementById('traceBtn').textContent = 'مسار الطيران: ظاهر';

  // Slow-motion capture helper (G2/G3/G5 proofs): slows every WAAPI animation AND the physics clock.
  // Uses Animation.playbackRate on all live animations (document.timeline.playbackRate is not in Baseline).
  let slowOn = false;
  const SLOW = Number(params.get('slow')) || 0.25;
  function setSlow(on) {
    slowOn = on;
    const rate = on ? SLOW : 1;
    clock.setRate(rate);
    document.getAnimations().forEach((a) => { a.playbackRate = rate; });
    window.__slowRate = rate;
    const b = document.getElementById('slowBtn');
    b.setAttribute('aria-pressed', String(on)); b.textContent = on ? `حركة بطيئة x${SLOW}: تعمل` : `حركة بطيئة x${SLOW}: متوقفة`;
  }
  // Keep new animations slowed while slow-mo is on (monkey-patch is local to the demo page only).
  const _animate = Element.prototype.animate;
  Element.prototype.animate = function (...a) { const an = _animate.apply(this, a); if (slowOn) an.playbackRate = SLOW; return an; };
  window.__setSlow = setSlow;

  // K8 Foley: one SoundBus per page. Unlock ONLY inside a synchronous user gesture (autoplay policy);
  // never bypassed with flags. Any failure leaves the visuals untouched and is reported in the hud.
  let bus = null, foley = null;
  function unlockAudio() {
    if (!bus) return;
    const ok = bus.unlock();
    const b = document.getElementById('muteBtn');
    if (!ok) { b.textContent = 'الصوت: غير متاح (' + bus.status + ')'; b.disabled = true; return; }
    b.textContent = bus.muted ? 'الصوت: مكتوم' : 'الصوت: يعمل';
  }
  ['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
  document.getElementById('muteBtn').addEventListener('click', (e) => {
    if (!bus) return; bus.setMuted(!bus.muted); e.currentTarget.setAttribute('aria-pressed', String(bus.muted));
    e.currentTarget.textContent = bus.muted ? 'الصوت: مكتوم' : 'الصوت: يعمل';
  });
  // any interaction wakes a resting owl
  stage.addEventListener('pointerdown', () => rigs.forEach((r) => r.states && r.states.wake()), { capture: true });
  if (params.get('slowmo') === '1') document.addEventListener('rigs-ready', () => setSlow(true), { once: true });

  document.getElementById('count').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-n]'); if (!b) return;
    document.querySelectorAll('#count button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    build(Number(b.dataset.n));
  });

  document.getElementById('art').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-art]'); if (!b) return;
    document.querySelectorAll('#art button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    art = b.dataset.art; build(count);
  });
  document.querySelectorAll('#art button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.art === art)));

  document.getElementById('actions').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    act(b.dataset.act);
  });

  // Tap: a different reaction each time (never the same twice in a row), including flight.
  const TAP_POOL = ['celebrate', 'fly', 'think', 'nod', 'sad', 'talk', 'fly', 'celebrate'];
  let lastTap = '';
  function tapReact(rig, slot) {
    if (rig.busy) return;
    if (rig.states) return rig.states.fire('user:tap', { room: roomOf(slot), trace: traceOn });
    let pick; do { pick = TAP_POOL[Math.floor(Math.random() * TAP_POOL.length)]; } while (pick === lastTap);
    lastTap = pick;
    runAct(rig, slot, pick);
  }

  // v2: app-style events go through the data-driven state machine (states.js); v1 keeps direct calls.
  const EVENT_OF = { celebrate: 'answer:correct', sad: 'answer:wrong', think: 'answer:pending', nod: 'lesson:start', talk: 'explain:start' };
  function runAct(rig, slot, name) {
    if (rig.states) {
      if (name === 'fly') return rig.states.fire('move:to', { room: roomOf(slot), trace: traceOn });
      if (name.startsWith('perch:')) {
        const where = name.slice(6);
        return rig.states.fire('move:to', where === 'home' ? { home: true, target: null, trace: traceOn } : { target: document.getElementById('perch-' + where), trace: traceOn });
      }
      if (name.startsWith('say:')) return rig.states.fire('explain:start', { url: name.slice(4) });
      if (name === 'talk') return rig.states.fire('explain:start', { ms: 3200 });
      if (EVENT_OF[name]) return rig.states.fire(EVENT_OF[name]);
      if (name === 'blink') return rig.blink(true);
      return rig[name] && rig[name]();
    }
    if (name === 'fly') return flyOne(rig, slot);
    if (name.startsWith('say:')) return rig.say(name.slice(4));
    if (name.startsWith('perch:')) {
      const where = name.slice(6);
      if (where === 'home') return rig.flyTo(null, { home: true });
      return rig.flyTo(document.getElementById('perch-' + where));
    }
    if (name === 'talk') return rig.talk(rig.constructor.syntheticEnvelope(), 3200);
    if (name === 'blink') return rig.blink(true);
    return rig[name] && rig[name]();
  }

  // Free room around a slot inside the stage (px) - the v2 roam() keeps its arcs inside it.
  function roomOf(slot) {
    const sr = stage.getBoundingClientRect(), r = slot.getBoundingClientRect();
    return { left: Math.max(40, r.left - sr.left - 8), right: Math.max(40, sr.right - r.right - 8), up: Math.max(60, r.top - sr.top - 8) };
  }

  // Flight across the visible stage: pick a plan, scale it to the free space around the slot.
  async function flyOne(rig, slot) {
    if (rig.busy) return;
    const sr = stage.getBoundingClientRect(), r = slot.getBoundingClientRect();
    const plans = rig.constructor.flightPlans(sr.width, sr.height);
    const plan = plans[Math.floor(Math.random() * plans.length)];
    // keep inside the stage: clamp horizontal amplitude to the free room on each side
    const roomL = r.left - sr.left - 8, roomR = sr.right - r.right - 8, roomUp = r.top - sr.top - 8;
    const pts = plan.pts.map((p) => ({
      x: Math.max(-roomL, Math.min(roomR, p.x)),
      y: Math.max(-roomUp, Math.min(0, p.y)), t: p.t
    }));
    slot.classList.add('flying');
    await rig.fly(pts, { roll: plan.roll ?? null, flipAt: plan.flipAt ?? null }, { base: rig._perch || { x: 0, y: 0 } });
    slot.classList.remove('flying');
  }

  // Autonomous life: every few seconds the owl does something on her own (flight is frequent).
  let autoOn = params.get('auto') !== '0', autoTimer = 0;
  const LIFE_POOL = ['fly', 'look', 'nod', 'perch:card', 'think', 'talk', 'blink', 'perch:answer', 'fly', 'perch:home'];
  function lifeTick() {
    clearTimeout(autoTimer);
    if (!autoOn) return;
    autoTimer = setTimeout(() => {
      const idle = rigs.filter((r) => !r.busy);
      if (idle.length) {
        const rig = idle[Math.floor(Math.random() * idle.length)];
        const slot = rig.svg.parentElement;
        const pick = LIFE_POOL[Math.floor(Math.random() * LIFE_POOL.length)];
        if (pick === 'look') rig.look();
        else if (pick.startsWith('perch:') && rigs.length > 1) runAct(rig, slot, 'fly');   // perches are for the solo owl scene
        else runAct(rig, slot, pick);
      }
      lifeTick();
    }, 3500 + Math.random() * 4000);
  }
  document.getElementById('autoBtn').addEventListener('click', (e) => {
    autoOn = !autoOn; e.currentTarget.setAttribute('aria-pressed', String(autoOn));
    e.currentTarget.textContent = autoOn ? 'حياة تلقائية: تعمل' : 'حياة تلقائية: متوقفة';
    lifeTick();
  });
  document.addEventListener('rigs-ready', lifeTick);

  // Mock lesson elements the owl can perch on (decorative, aria-hidden, pointer-events none)
  function addPerches() {
    for (const [id, cls, txt] of [['perch-card', 'card', '7 x 8 = ?'], ['perch-answer', 'answer', '56']]) {
      const d = document.createElement('div'); d.className = 'perch ' + cls; d.id = id; d.setAttribute('aria-hidden', 'true');
      const sp = document.createElement('span'); sp.textContent = txt; d.appendChild(sp); stage.prepend(d);
    }
  }

  function sprinkleStars() {
    stage.querySelectorAll('.star').forEach((s) => s.remove());
    for (let i = 0; i < 18; i++) {
      const st = document.createElement('i'); st.className = 'star';
      st.style.left = (Math.random() * 100) + '%'; st.style.top = (Math.random() * 70) + '%';
      st.style.animationDelay = (Math.random() * 3) + 's'; stage.prepend(st);
    }
  }

  function act(name) {
    if (name === 'auto') return;
    rigs.forEach((r, i) => {
      const delay = i * 90; // stagger so the group reads as a crowd, not a copy
      setTimeout(() => runAct(r, r.svg.parentElement, name), delay);
    });
  }

  // ---- K9.2c acting bar: everything here flips existing engine capabilities on demand ----
  const browsBtn = document.getElementById('browsBtn'), posesBtn = document.getElementById('posesBtn'), poseBtns = document.getElementById('poseBtns'), caption = document.getElementById('caption');
  let browsShown = BROWS;
  function setBrows(on) {
    browsShown = on; browsBtn.setAttribute('aria-pressed', String(on)); browsBtn.textContent = on ? 'الحواجب: ظاهرة' : 'الحواجب: مخفية';
    rigs.forEach((r) => r.svg.querySelectorAll('[data-feature="brows"]').forEach((g) => { g.style.display = on ? '' : 'none'; }));
  }
  function showPoses(on) { posesBtn.setAttribute('aria-pressed', String(on)); poseBtns.hidden = !on; if (!on) rigs.forEach((r) => r.poses && r.poses.release()); }
  function freezePose(name) {
    rigs.forEach((r) => {
      if (!r.poses) return;
      if (!name) { r.poses.release(); r.svg.getAnimations({ subtree: true }).forEach((a) => { if (a.playState === 'paused' && !r.poses.layers[a.effect.target.dataset.joint]) a.play(); }); return; }
      r.poses.apply(name, { stay: true, snapMs: r.spec.poses[name].snapMs || 60 }).then(() => r.later(() => r.poses.freeze(), 120));
    });
  }
  function say(txt, ms) { caption.textContent = txt; caption.hidden = !txt; if (ms) setTimeout(() => { if (caption.textContent === txt) caption.hidden = true; }, ms); }
  document.getElementById('acting').addEventListener('click', (e) => {
    const p = e.target.closest('button[data-pose]'); if (p) { freezePose(p.dataset.pose); return; }
    const b = e.target.closest('button[data-actx]'); if (!b) return;
    const x = b.dataset.actx;
    if (x === 'brows') return setBrows(!browsShown);
    if (x === 'poses') return showPoses(poseBtns.hidden);
    if (x === 'wink') return rigs.forEach((r, i) => r.wink && setTimeout(() => r.wink(), i * 120));
    if (x === 'dart') return rigs.forEach((r) => r.dart && r.dart());
    if (x === 'roll') return rigs.forEach((r) => { if (r.busy || !r.states) return; r._forcedRoll = 'medium'; r.states.fire('move:to', { room: roomOf(r.svg.parentElement), trace: traceOn }); });
    if (x === 'intent') return intentToAnswer();
    if (x === 'triumph' || x === 'oops' || x === 'puzzled') return performOnce(x);
    if (x === 'reel') return reel();
  });
  if (!BROWS) setBrows(false);
  if (POSES) showPoses(true);

  // ---- K9.3 intent: eyes -> head -> body -> flight, toward the answer card (solo owl); the flight itself is the existing move:to ----
  // ---- K9.4 performances from the bar: the state machine escalates (small small medium small small medium large); the caption reads the tier ----
  const PERF_EVENT = { triumph: 'answer:correct', oops: 'answer:wrong', puzzled: 'answer:pending' };
  const TIER_AR = { small: 'صغيرة', medium: 'متوسطة', large: 'كبيرة' };
  const PERF_AR = { triumph: 'انتصار', oops: 'خطأ كوميدي (take)', puzzled: 'حيرة' };
  function performOnce(name) {
    const r = rigs[0]; if (!r || r.busy || !r.states) return;
    const n = ((r._esc && r._esc[name]) || 0) + 1;
    r.states.fire(PERF_EVENT[name]);
    const tier = (r._lastPerf && r._lastPerf.name === name) ? r._lastPerf.tier : null;
    say(`${PERF_AR[name]} #${n}: درجة ${tier ? TIER_AR[tier] : ''} - السابعة دائماً كبيرة`, 2600);
  }

  function intentToAnswer() {
    const r = rigs[0]; if (!r || r.busy || !r.states) return;
    const target = document.getElementById('perch-answer');
    say('نية: العينان أولاً ثم الرأس ثم الجسم ثم القفزة', 2600);
    const away = r._perch && Math.hypot(r._perch.x, r._perch.y) > 30;   // second press brings her home (intent again, toward home)
    return r.states.fire('move:to', away ? { home: true, target: null, trace: traceOn } : { target, trace: traceOn });
  }

  // ---- K9.2c-7 reel: <= 30 s, one owl, every capability in order; each beat is logged to window.__reel ----
  const REEL_BEATS = [
    { t: 0,     name: 'alert',    cap: 'يقظة: الحواجب والعينان تسبقان الرأس',      run: (r) => r.poses.apply('alert', { holdMs: 900 }) },
    { t: 1600,  name: 'dart',     cap: 'نظرة خاطفة: الحدقتان تتحركان داخل العين',   run: (r) => r.dart() },
    { t: 3200,  name: 'charged',  cap: 'تحفز: انحناء قبل الانطلاق',                 run: (r) => r.poses.apply('charged', { holdMs: 700 }) },
    { t: 4600,  name: 'roll',     cap: 'تنظر ثم تقفز: العينان ثم الرأس ثم الجسم، وانطلاق بلفة هوائية كاملة', run: (r) => { r._forcedRoll = 'large'; return r.states.fire('move:to', { by: { dx: 240, dy: -140 }, trace: traceOn }); } },
    { t: 10500, name: 'puzzled',  cap: 'حيرة: نظرة حلزونية وميل رأس وفقاعة تفكير',     run: (r) => (r.puzzled && r.perfSpec && r.perfSpec('puzzled')) ? r.puzzled('large') : r.states.fire('answer:pending') },
    { t: 14500, name: 'triumph',  cap: 'انتصار كبير: قفزة بلفة كاملة وغمزة ونجوم وقلوب',   run: (r) => (r.triumph && r.perfSpec && r.perfSpec('triumph')) ? r.triumph('large') : (r.states.fire('answer:correct'), r.later(() => r.wink('R'), 500)) },
    { t: 18500, name: 'oops',     cap: 'خطأ كوميدي: استعداد مزدوج ثم دهشة ثم ارتجاج',  run: (r) => (r.oops && r.perfSpec && r.perfSpec('oops')) ? r.oops('large') : r.states.fire('answer:wrong') },
    { t: 22500, name: 'home',     cap: 'عودة إلى المكان',                              run: (r) => r.states.fire('move:to', { home: true, target: null, trace: traceOn }) },
    { t: 26500, name: 'rest',     cap: 'سكون: Zzz',                                    run: (r) => r.states.fire('idle:long') },
  ];
  let reelRunning = false;
  async function reel() {
    if (reelRunning) return; reelRunning = true;
    const r = rigs[0]; if (!r || !r.states || !r.poses) { reelRunning = false; return; }
    const wasAuto = autoOn; autoOn = false; clearTimeout(autoTimer);
    if (r.states.state === 'rest') await r.states.wake();
    const t0 = performance.now(); window.__reel = { t0, beats: [], done: false };
    for (const b of REEL_BEATS) {
      const wait = b.t - (performance.now() - t0); if (wait > 0) await new Promise((res) => setTimeout(res, wait));
      say(b.cap, 3500);
      const beat = { name: b.name, t: Math.round(performance.now() - t0), stateBefore: r.states.state };
      window.__reel.beats.push(beat);
      try { await Promise.race([Promise.resolve(b.run(r)), new Promise((res) => setTimeout(res, 5200))]); } catch (err) { console.warn('reel beat', b.name, err); }
      beat.stateAfter = r.states.state; beat.tEnd = Math.round(performance.now() - t0); beat.pose = r.poses.current; beat.roll = r._lastRoll ? r._lastRoll.mode : null;
    }
    window.__reel.total = Math.round(performance.now() - t0); window.__reel.done = true;
    say(`انتهى العرض في ${(window.__reel.total / 1000).toFixed(1)} ث`, 3000);
    autoOn = wasAuto; if (autoOn) lifeTick(); reelRunning = false;
  }
  window.__reel_start = reel;
  if (REEL) document.addEventListener('rigs-ready', () => setTimeout(reel, 800), { once: true });
  window.__act = act;
  window.__build = build;

  // FPS HUD (rAF delta sampling; cheap)
  const hud = document.getElementById('hud');
  if (params.get('hud') === '0') hud.style.display = 'none';   // proofs capture without the overlay
  let frames = [], last = performance.now();
  function loop(now) {
    frames.push(now - last); last = now;
    if (frames.length >= 60) {
      const s = [...frames].sort((a, b) => a - b);
      const p50 = s[Math.floor(s.length * 0.5)], p95 = s[Math.floor(s.length * 0.95)];
      hud.textContent = `frames ${frames.length}\np50 ${p50.toFixed(1)} ms\np95 ${p95.toFixed(1)} ms\nanims ${document.getAnimations().length}\nnodes ${document.getElementsByTagName('*').length}\naudio ${bus ? bus.status + (bus.muted ? ' muted' : '') + ' v' + bus.stats.played : 'off'}`;
      frames = [];
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.querySelectorAll('#count button').forEach((x) => x.setAttribute('aria-pressed', String(Number(x.dataset.n) === count)));
  build(count);

  // Path C (a): sandbox-scoped Service Worker (scope = this folder only).
  if ('serviceWorker' in navigator && params.get('sw') !== '0') {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((err) => console.warn('sw', err.message));
  }
</script>
</body>
