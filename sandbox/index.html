<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandbox A1 - SVG rig prototype (Gate 4)</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --ink:#f1f5f9; --accent:#f59e0b; --ok:#22c55e; }
  * { box-sizing:border-box }
  html,body { margin:0; background:radial-gradient(120% 80% at 50% 0%, #1e3a5f 0%, var(--bg) 60%); color:var(--ink); font:16px/1.5 system-ui, "Segoe UI", Tahoma, sans-serif; min-height:100dvh }
  header { padding:14px 16px 6px; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:baseline }
  header h1 { font-size:18px; margin:0 }
  header small { opacity:.7 }
  .bar { display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px }
  button { border:0; border-radius:12px; padding:10px 14px; font:inherit; font-weight:700; background:var(--card); color:var(--ink); cursor:pointer; box-shadow:0 2px 0 #0008 }
  button:active { transform:translateY(1px); box-shadow:none }
  button.primary { background:var(--accent); color:#111 }
  button[aria-pressed="true"] { outline:3px solid var(--ok) }
  #stage { display:grid; gap:12px; padding:10px 16px 24px; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); align-items:end; justify-items:center; min-height:52dvh; position:relative; overflow:hidden }
  #stage.sky { background:linear-gradient(180deg,#0000 0%, #0002 100%); border-radius:24px; margin:0 12px }
  #stage.sky::before { content:""; position:absolute; inset:auto 0 0 0; height:14%; background:linear-gradient(180deg,#0000,#0b1224); }
  .slot { width:100%; max-width:220px; aspect-ratio:200/240; background:linear-gradient(180deg,#0000 60%, #0003); border-radius:20px; position:relative; overflow:visible; will-change:transform; transform-origin:50% 60% }
  .slot.flying { z-index:5 }
  #stage.sky .slot { background:none }
  .star { position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; opacity:.5; animation:tw 3s ease-in-out infinite alternate }
  @keyframes tw { from { opacity:.15 } to { opacity:.7 } }
  @media (prefers-reduced-motion: reduce) { .star { animation:none } }
  .slot svg { width:100%; height:100%; display:block; overflow:visible }
  .slot .tag { position:absolute; inset:auto 0 -4px 0; text-align:center; font-size:13px; opacity:.75 }
  #hud { position:fixed; inset:auto 8px 8px auto; background:#000a; font:12px/1.4 ui-monospace, monospace; padding:8px 10px; border-radius:10px; direction:ltr; white-space:pre; min-width:180px }
  #note { padding:0 16px 16px; font-size:13px; opacity:.75 }
</style>
</head>
<body>
<header>
  <h1>عينة Gate 4: هيكل SVG بمفاصل حيّة (بدون أي مكتبة)</h1>
  <small>فرع sandbox/a1-vector-rig فقط - لا يمس التطبيق</small>
</header>

<div class="bar" id="count" role="group" aria-label="عدد الرفقاء">
  <button data-n="1" aria-pressed="true">رفيق واحد</button>
  <button data-n="3">3 رفقاء</button>
  <button data-n="5">5 رفقاء</button>
</div>
<div class="bar" id="art" role="group" aria-label="نوع الرسم">
  <button data-art="p1" aria-pressed="true">P1 رسم هندسي (إثبات)</button>
  <button data-art="p2">P2 طبقات مجسمة (AI)</button>
</div>
<div class="bar" id="actions" role="group" aria-label="الحركات">
  <button class="primary" data-act="fly">تطير في الشاشة</button>
  <button data-act="talk">يتكلم</button>
  <button data-act="celebrate">إجابة صحيحة</button>
  <button data-act="nod">إيماءة</button>
  <button data-act="think">يفكر</button>
  <button data-act="sad">إجابة خطأ</button>
  <button data-act="blink">رمشة</button>
  <button data-act="auto" id="autoBtn" aria-pressed="true">حياة تلقائية: تعمل</button>
</div>

<main id="stage" aria-live="polite"></main>
<p id="note">التركيز الحالي: «حكيمة» البومة (P2 طبقات مجسمة). اضغط عليها لتفاعل مختلف كل مرة؛ تطير وتدور وتحط من تلقاء نفسها كل بضع ثوان. P1 الهندسي يبقى كمرجع اختبار فقط.</p>
<div id="hud" aria-hidden="true">fps --</div>

<script type="module">
  import { mount } from './rig.js?v=g4';

  const ART = { p1: ['companions/owl.svg', 'companions/bee.svg'], p2: ['companions/owl_p2.svg'] };
  const params = new URLSearchParams(location.search);
  let art = params.get('art') === 'p1' ? 'p1' : 'p2';
  let FILES = ART[art];
  let count = Number(params.get('n')) || 1;
  const NAMES = { owl: 'حكيمة', bee: 'نونة' };
  const stage = document.getElementById('stage');
  let rigs = [];

  async function build(n) {
    count = n; FILES = ART[art];
    rigs.forEach((r) => r.dispose());
    rigs = [];
    stage.replaceChildren();
    const jobs = [];
    for (let i = 0; i < n; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      stage.appendChild(slot);
      const file = FILES[i % FILES.length];
      jobs.push(mount(slot, file, `i${i}`).then((rig) => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.textContent = NAMES[rig.svg.dataset.companion] || '';
        slot.appendChild(tag);
        slot.addEventListener('pointerdown', (ev) => { ev.stopPropagation(); tapReact(rig, slot); });
        return rig;
      }));
    }
    rigs = await Promise.all(jobs);
    stage.classList.toggle('sky', art === 'p2');
    if (art === 'p2') sprinkleStars();
    window.__rigs = rigs;
    document.dispatchEvent(new CustomEvent('rigs-ready', { detail: { n } }));
  }

  document.getElementById('count').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-n]'); if (!b) return;
    document.querySelectorAll('#count button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    build(Number(b.dataset.n));
  });

  document.getElementById('art').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-art]'); if (!b) return;
    document.querySelectorAll('#art button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    art = b.dataset.art; build(count);
  });
  document.querySelectorAll('#art button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.art === art)));

  document.getElementById('actions').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    act(b.dataset.act);
  });

  // Tap: a different reaction each time (never the same twice in a row), including flight.
  const TAP_POOL = ['celebrate', 'fly', 'think', 'nod', 'sad', 'talk', 'fly', 'celebrate'];
  let lastTap = '';
  function tapReact(rig, slot) {
    if (rig.busy) return;
    let pick; do { pick = TAP_POOL[Math.floor(Math.random() * TAP_POOL.length)]; } while (pick === lastTap);
    lastTap = pick;
    runAct(rig, slot, pick);
  }

  function runAct(rig, slot, name) {
    if (name === 'fly') return flyOne(rig, slot);
    if (name === 'talk') return rig.talk(rig.constructor.syntheticEnvelope(), 3200);
    if (name === 'blink') return rig.blink(true);
    return rig[name] && rig[name]();
  }

  // Flight across the visible stage: pick a plan, scale it to the free space around the slot.
  async function flyOne(rig, slot) {
    if (rig.busy) return;
    const sr = stage.getBoundingClientRect(), r = slot.getBoundingClientRect();
    const plans = rig.constructor.flightPlans(sr.width, sr.height);
    const plan = plans[Math.floor(Math.random() * plans.length)];
    // keep inside the stage: clamp horizontal amplitude to the free room on each side
    const roomL = r.left - sr.left - 8, roomR = sr.right - r.right - 8, roomUp = r.top - sr.top - 8;
    const pts = plan.pts.map((p) => ({
      x: Math.max(-roomL, Math.min(roomR, p.x)),
      y: Math.max(-roomUp, Math.min(0, p.y)), t: p.t
    }));
    slot.classList.add('flying');
    await rig.fly(pts, { roll: plan.roll ?? null, flipAt: plan.flipAt ?? null });
    slot.classList.remove('flying');
    slot.style.transform = ''; // path ends at the origin by design
  }

  // Autonomous life: every few seconds the owl does something on her own (flight is frequent).
  let autoOn = params.get('auto') !== '0', autoTimer = 0;
  const LIFE_POOL = ['fly', 'look', 'nod', 'fly', 'think', 'talk', 'blink', 'fly'];
  function lifeTick() {
    clearTimeout(autoTimer);
    if (!autoOn) return;
    autoTimer = setTimeout(() => {
      const idle = rigs.filter((r) => !r.busy);
      if (idle.length) {
        const rig = idle[Math.floor(Math.random() * idle.length)];
        const slot = rig.svg.parentElement;
        const pick = LIFE_POOL[Math.floor(Math.random() * LIFE_POOL.length)];
        if (pick === 'look') rig.look(); else runAct(rig, slot, pick);
      }
      lifeTick();
    }, 3500 + Math.random() * 4000);
  }
  document.getElementById('autoBtn').addEventListener('click', (e) => {
    autoOn = !autoOn; e.currentTarget.setAttribute('aria-pressed', String(autoOn));
    e.currentTarget.textContent = autoOn ? 'حياة تلقائية: تعمل' : 'حياة تلقائية: متوقفة';
    lifeTick();
  });
  document.addEventListener('rigs-ready', lifeTick);

  function sprinkleStars() {
    stage.querySelectorAll('.star').forEach((s) => s.remove());
    for (let i = 0; i < 18; i++) {
      const st = document.createElement('i'); st.className = 'star';
      st.style.left = (Math.random() * 100) + '%'; st.style.top = (Math.random() * 70) + '%';
      st.style.animationDelay = (Math.random() * 3) + 's'; stage.prepend(st);
    }
  }

  function act(name) {
    if (name === 'auto') return;
    rigs.forEach((r, i) => {
      const delay = i * 90; // stagger so the group reads as a crowd, not a copy
      setTimeout(() => runAct(r, r.svg.parentElement, name), delay);
    });
  }
  window.__act = act;
  window.__build = build;

  // FPS HUD (rAF delta sampling; cheap)
  const hud = document.getElementById('hud');
  let frames = [], last = performance.now();
  function loop(now) {
    frames.push(now - last); last = now;
    if (frames.length >= 60) {
      const s = [...frames].sort((a, b) => a - b);
      const p50 = s[Math.floor(s.length * 0.5)], p95 = s[Math.floor(s.length * 0.95)];
      hud.textContent = `frames ${frames.length}\np50 ${p50.toFixed(1)} ms\np95 ${p95.toFixed(1)} ms\nanims ${document.getAnimations().length}\nnodes ${document.getElementsByTagName('*').length}`;
      frames = [];
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.querySelectorAll('#count button').forEach((x) => x.setAttribute('aria-pressed', String(Number(x.dataset.n) === count)));
  build(count);

  // Path C (a): sandbox-scoped Service Worker (scope = this folder only).
  if ('serviceWorker' in navigator && params.get('sw') !== '0') {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((err) => console.warn('sw', err.message));
  }
</script>
</body>
</html>
