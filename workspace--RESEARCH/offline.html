<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل — بوابة أبطال البيت</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --text: #0f172a;
      --text-secondary: #64748b;
      --accent: #6366f1;
    }

    [data-theme="dark"] {
      --bg: #0c0a09;
      --text: #fafaf9;
      --text-secondary: #a8a29e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: white;
      box-shadow: 0 20px 40px rgba(99, 102, 241, 0.3);
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .features {
      margin-top: 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .feature {
      padding: 16px;
      background: var(--bg);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
    }

    .feature-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .feature-text {
      font-size: 13px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>لا يمكن تحميل المحتوى الآن. تحقق من اتصالك بالإنترنت وحاول مرة أخرى.</p>
    <button class="btn" onclick="window.location.reload()">
      🔄 إعادة المحاولة
    </button>
    <div class="features">
      <div class="feature">
        <div class="feature-icon">📚</div>
        <div class="feature-text">المحتوى المحفوظ متاح</div>
      </div>
      <div class="feature">
        <div class="feature-icon">💾</div>
        <div class="feature-text">التقدم محفوظ محلياً</div>
      </div>
    </div>
  </div>
</body>
</html>
